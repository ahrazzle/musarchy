# Musarchy service hardening.
#
# This is the source of truth for the drop-in that install.sh writes to
# /etc/systemd/system/musegadget.service.d/10-musarchy-hardening.conf.
# Keep the two in sync.
#
# Commands still run as the run-as account with that account's normal
# permissions; these directives restrict only the service process itself.

[Service]
NoNewPrivileges=true
ProtectSystem=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
PrivateTmp=true
